name: Course Management Portal Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
     #checkout the repo
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # stop for any command fails
            set -e

            REPO_DIR=/home/node3/course-portal/frontend/course_management_portal_frontend

            git pull origin main

            echo "===Deploy the containers==="
            docker-compose stop course-frontend || true
            docker system prune -af || true
            docker-compose up -d course-frontend
            docker ps
