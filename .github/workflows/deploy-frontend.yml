name: Course Management Portal Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
     #checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      #Coneect to tailscale 
      - name: Conenct VPN
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TS_AUTH_KEY }}

      # Deploy to the server
      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

            # stop for any command fails
            set -e

            REPO_DIR=/home/node3/course-portal/frontend/course_management_portal_frontend

            echo "====Fix floder permission===="
            sudo chown -R node3:node3 "$REPO_DIR" || true
            chmod -R u+rwX "$REPO_DIR/.git" || true

            echo "===Pull the latest code==="

            cd "$REPO_DIR"

            git config --global --add safe.directory "$REPO_DIR"
            git pull origin main

            echo "===Deploy the containers==="
            docker-compose stop course-frontend || true
            docker system prune -af || true
            docker-compose up -d course-frontend
            docker ps
          EOF
